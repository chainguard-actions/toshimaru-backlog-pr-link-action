name: Test action with missing backlog-host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: feature/PROJ-456-another-feature
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/github-event2
          cat > /tmp/github-event2/event.json <<'EOF'
          {
            "pull_request": {
              "number": 2,
              "title": "PROJ-456 Another feature",
              "body": "Fixes PROJ-456",
              "html_url": "https://github.com/test-owner/test-repo/pull/2"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event2/event.json" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          backlog-api-key: fake-api-key-for-testing
          backlog-host: myorg.backlog.com
      - name: Assert action ran with provided inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should run (success or failure due to API call with fake credentials)
          # It should NOT be 'skipped' or 'cancelled'
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome with myorg.backlog.com host"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
