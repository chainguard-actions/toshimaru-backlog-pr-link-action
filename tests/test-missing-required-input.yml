name: Test missing required input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action declares backlog-host as required. Omitting it should cause
      # the action runner to fail before even executing the action's main code.
      # We use continue-on-error to capture the failure and assert on the outcome.
      - id: action
        uses: .
        with:
          backlog-api-key: fake-api-key-for-testing
          # backlog-host intentionally omitted to test required input validation
        continue-on-error: true

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required input 'backlog-host' is missing, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input is missing"
