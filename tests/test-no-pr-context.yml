name: Test no PR context error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          backlog-api-key: fake-api-key-for-testing
          backlog-host: example.backlog.com
        # The action will call core.setFailed() when pull_request payload is missing.
        # We use continue-on-error so the workflow doesn't stop here.
        continue-on-error: true
      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by pull_request event, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request context is available"
