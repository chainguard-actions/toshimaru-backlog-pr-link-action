name: Test no pull_request payload error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request event context. Under workflow_dispatch
      # (which act always uses), context.payload.pull_request is undefined, so
      # the action should fail with a specific error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          backlog-api-key: 'dummy-api-key'
          backlog-host: 'example.backlog.com'

      - name: Assert action failed due to missing PR payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by pull_request event, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pull_request payload is missing"
