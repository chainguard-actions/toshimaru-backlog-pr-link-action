name: Test push event with Backlog issue key in branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/feature/PROJ-456-another-feature
      GITHUB_HEAD_REF: feature/PROJ-456-another-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create push event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "ref": "refs/heads/feature/PROJ-456-another-feature",
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "test-user"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          backlog-api-key: fake-api-key-for-testing
          backlog-host: example.backlog.com

      - name: Assert action ran without setup errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should run and either succeed or fail due to API connectivity.
          # A 'skipped' outcome would indicate the action didn't run at all.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
